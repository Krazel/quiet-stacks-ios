name: Quiet Stacks sideload IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify web game
        run: npm test
      - name: Build offline iPhone and iPad IPA
        run: bash scripts/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: QuietStacks-0.16.3-build1-${{ github.sha }}-Local-QA
          path: web-demo/artifacts/ios/
          if-no-files-found: error
          retention-days: 14
