name: iOS gallery launch QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-demo
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/simulator-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QuietStacks-native-QA
          path: web-demo/artifacts/native-qa/
          retention-days: 7
